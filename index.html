<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge. — 2D Game Editor</title><style>
:root{font:14px system-ui,sans-serif;color:#dce3ed;background:#10141d}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{background:#273247;color:#eaf1fa;border:1px solid #39465c;border-radius:6px;padding:7px 11px;cursor:pointer}button:hover{background:#35445e}button.primary{background:#4264df;border-color:#5978f5}input,select{width:100%;background:#171f2d;color:#f0f4fb;border:1px solid #364357;border-radius:5px;padding:7px}header{height:56px;border-bottom:1px solid #2c374a;display:flex;align-items:center;gap:9px;padding:0 16px;background:#171e2b}header strong{font-size:23px;letter-spacing:-1px;margin-right:16px;color:#fafcff}.workspace{display:grid;grid-template-columns:215px minmax(0,1fr) 260px;height:calc(100vh - 56px)}aside{background:#171e2b;padding:14px;border-right:1px solid #2c374a;overflow:auto}aside.right{border-right:0;border-left:1px solid #2c374a}.heading{font-size:11px;font-weight:800;color:#95a4bc;letter-spacing:1.5px;margin:5px 0 13px}.obj{display:flex;align-items:center;justify-content:space-between;padding:9px;border-radius:6px;cursor:pointer}.obj:hover{background:#273247}.obj.active{background:#293e72;color:#fff}main{display:flex;flex-direction:column;min-width:0}.toolbar{display:flex;gap:8px;align-items:center;padding:10px;background:#1b2432;border-bottom:1px solid #2c374a;flex-wrap:wrap}.stage{flex:1;display:grid;place-items:center;overflow:auto;padding:25px;background-color:#111824;background-image:radial-gradient(#29354a 1px,transparent 1px);background-size:20px 20px}canvas{width:min(100%,960px);aspect-ratio:16/9;display:block;background:#202a3b;border:1px solid #546178;box-shadow:0 15px 55px #0009;touch-action:none}.status{padding:9px 13px;color:#aab7c9;border-top:1px solid #2c374a;font-size:12px}.field{margin:12px 0}.field label{display:block;color:#a8b7cd;margin-bottom:5px;font-size:12px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.muted{color:#8899b0;font-size:12px}.hidden{display:none}#empty{padding:10px;color:#9eacc0}#playBadge{color:#89e6b0;font-weight:bold}@media(max-width:760px){.workspace{grid-template-columns:145px minmax(0,1fr)}aside.right{grid-column:1/-1;border-top:1px solid #2c374a}.workspace{height:auto}main{min-height:440px}header{height:auto;flex-wrap:wrap;padding:10px}.stage{min-height:360px}}
</style></head><body>
<header><strong>Forge<span style="color:#7193ff">.</span></strong><button id="new">New Scene</button><button id="save">Save</button><button id="load">Load</button><button id="export">Export JSON</button><button id="import">Import JSON</button><input id="file" type="file" accept=".json,application/json" hidden><span style="flex:1"></span><button id="play" class="primary">▶ Play</button><button id="stop">■ Stop</button></header>
<div class="workspace"><aside><div class="heading">SCENE HIERARCHY</div><div id="tree"></div><div class="row"><button id="addRect">+ Rectangle</button><button id="addCircle">+ Circle</button></div><div class="heading" style="margin-top:30px">CONTROLS</div><p class="muted">Editor: drag objects to move them. Delete removes selection.</p><p class="muted">Play: A/D or ←/→ to move. Space, W or ↑ to jump.</p></aside>
<main><div class="toolbar"><span>Scene 1</span><span style="flex:1"></span><span id="playBadge"></span><span class="muted">960 × 540</span></div><div class="stage"><canvas id="canvas" width="960" height="540"></canvas></div><div class="status" id="status">Ready • Changes save to your browser</div></main>
<aside class="right"><div class="heading">INSPECTOR</div><div id="inspector"></div></aside></div>
<script>
'use strict';
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),tree=document.querySelector('#tree'),inspector=document.querySelector('#inspector'),status=document.querySelector('#status');
const starter=()=>[{id:1,name:'Player',shape:'rect',x:110,y:340,w:44,h:44,color:'#7498ff',behavior:'platformer',solid:false},{id:2,name:'Ground',shape:'rect',x:0,y:470,w:960,h:70,color:'#536b82',behavior:'platform',solid:true},{id:3,name:'Platform',shape:'rect',x:340,y:360,w:220,h:24,color:'#6b8f91',behavior:'platform',solid:true}];
let objects=starter(),selected=1,nextId=4,playing=false,snapshot=null,drag=null,velocity={x:0,y:0},grounded=false,last=performance.now();
const keys=new Set();
function obj(){return objects.find(o=>o.id===selected)}
function notify(s){status.textContent=s}
function persist(){try{localStorage.setItem('forge-scene-v1',JSON.stringify(objects))}catch(e){notify('Storage unavailable: '+e.message)}}
function renderTree(){tree.replaceChildren();for(const o of objects){const el=document.createElement('div');el.className='obj'+(o.id===selected?' active':'');const name=document.createElement('span');name.textContent=(o.shape==='circle'?'● ':'▣ ')+o.name;el.append(name);el.onclick=()=>{selected=o.id;renderTree();renderInspector();draw()};tree.append(el)}}
function field(label,key,type='number'){const wrap=document.createElement('div');wrap.className='field';const l=document.createElement('label');l.textContent=label;const inp=document.createElement('input');inp.type=type;inp.value=obj()[key];if(type==='number')inp.step='1';inp.onchange=()=>{const o=obj();if(!o)return;let v=type==='number'?Number(inp.value):inp.value;if(type==='number'&&!Number.isFinite(v))return;o[key]=v;persist();renderTree();draw()};wrap.append(l,inp);return wrap}
function renderInspector(){inspector.replaceChildren();if(!obj()){inspector.textContent='Select an object';return}inspector.append(field('Name','name','text'));const p=document.createElement('div');p.className='pair';p.append(field('X','x'),field('Y','y'),field('Width','w'),field('Height','h'));inspector.append(p,field('Color','color','color'));const box=document.createElement('div');box.className='field';const label=document.createElement('label');label.textContent='Behaviour';const select=document.createElement('select');for(const type of ['none','platformer','platform','solid']){const opt=document.createElement('option');opt.value=type;opt.textContent=type[0].toUpperCase()+type.slice(1);select.append(opt)}select.value=obj().behavior;select.onchange=()=>{obj().behavior=select.value;obj().solid=['platform','solid'].includes(select.value);persist();draw()};box.append(label,select);inspector.append(box);const del=document.createElement('button');del.textContent='Delete Object';del.onclick=removeSelected;inspector.append(del)}
function draw(){ctx.clearRect(0,0,960,540);ctx.fillStyle='#202a3b';ctx.fillRect(0,0,960,540);ctx.strokeStyle='#ffffff0d';ctx.lineWidth=1;for(let x=0;x<960;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,540);ctx.stroke()}for(let y=0;y<540;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}for(const o of objects){ctx.fillStyle=o.color;if(o.shape==='circle'){ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+o.h/2,Math.max(1,o.w/2),Math.max(1,o.h/2),0,0,Math.PI*2);ctx.fill()}else ctx.fillRect(o.x,o.y,o.w,o.h);if(!playing&&o.id===selected){ctx.strokeStyle='#f6d36d';ctx.lineWidth=2;ctx.strokeRect(o.x-3,o.y-3,o.w+6,o.h+6)}}}
function refresh(){renderTree();renderInspector();draw()}
function add(shape){if(playing)return;const id=nextId++;objects.push({id,name:(shape==='circle'?'Circle ':'Rectangle ')+id,shape,x:160,y:130,w:80,h:80,color:shape==='circle'?'#ec9e70':'#8ba5f2',behavior:'none',solid:false});selected=id;persist();refresh()}
function removeSelected(){if(playing)return;objects=objects.filter(o=>o.id!==selected);selected=objects[0]?.id??null;persist();refresh()}
function position(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*540/r.height}}
canvas.addEventListener('pointerdown',e=>{if(playing)return;const p=position(e);const hit=[...objects].reverse().find(o=>p.x>=o.x&&p.x<=o.x+o.w&&p.y>=o.y&&p.y<=o.y+o.h);selected=hit?.id??null;drag=hit?{dx:p.x-hit.x,dy:p.y-hit.y}:null;canvas.setPointerCapture(e.pointerId);refresh()});
canvas.addEventListener('pointermove',e=>{if(!drag||playing||!obj())return;const p=position(e);obj().x=Math.round(p.x-drag.dx);obj().y=Math.round(p.y-drag.dy);renderInspector();draw()});
canvas.addEventListener('pointerup',()=>{if(drag)persist();drag=null});
function start(){if(playing)return;snapshot=JSON.stringify(objects);playing=true;velocity={x:0,y:0};grounded=false;document.querySelector('#playBadge').textContent='● PLAYING';notify('Running scene');draw()}
function stop(){if(!playing)return;playing=false;objects=JSON.parse(snapshot);snapshot=null;keys.clear();document.querySelector('#playBadge').textContent='';notify('Stopped — edit mode');refresh()}
function tick(t){const dt=Math.min((t-last)/1000,.04);last=t;if(playing){for(const p of objects.filter(o=>o.behavior==='platformer')){const axis=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'));velocity.x=axis*240;if(grounded&&(keys.has(' ')||keys.has('w')||keys.has('arrowup'))){velocity.y=-460;grounded=false}velocity.y+=1100*dt;const oldY=p.y;p.x+=velocity.x*dt;p.x=Math.max(0,Math.min(960-p.w,p.x));p.y+=velocity.y*dt;grounded=false;for(const platform of objects.filter(o=>o!==p&&o.solid)){const overlapX=p.x+p.w>platform.x&&p.x<platform.x+platform.w;if(overlapX&&velocity.y>=0&&oldY+p.h<=platform.y+12&&p.y+p.h>=platform.y){p.y=platform.y-p.h;velocity.y=0;grounded=true}}if(p.y>600){p.x=110;p.y=340;velocity.y=0}}draw()}requestAnimationFrame(tick)}
window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;keys.add(e.key.toLowerCase());if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key==='Delete'&&!playing)removeSelected()});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
document.querySelector('#addRect').onclick=()=>add('rect');document.querySelector('#addCircle').onclick=()=>add('circle');document.querySelector('#play').onclick=start;document.querySelector('#stop').onclick=stop;
document.querySelector('#new').onclick=()=>{if(!confirm('Replace current scene?'))return;stop();objects=starter();selected=1;nextId=4;persist();refresh()};
document.querySelector('#save').onclick=()=>{persist();notify('Saved to this browser')};
document.querySelector('#load').onclick=()=>{stop();try{const data=JSON.parse(localStorage.getItem('forge-scene-v1'));if(!Array.isArray(data))throw Error('No saved scene');objects=data;nextId=Math.max(0,...objects.map(o=>o.id))+1;selected=objects[0]?.id??null;refresh();notify('Loaded saved scene')}catch(e){notify('Load failed: '+e.message)}};
document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,objects},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='forge-scene.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.querySelector('#import').onclick=()=>document.querySelector('#file').click();
document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.objects))throw Error('Invalid scene');stop();objects=data.objects;nextId=Math.max(0,...objects.map(o=>o.id))+1;selected=objects[0]?.id??null;persist();refresh();notify('Scene imported')}catch(err){notify('Import failed: '+err.message)}e.target.value=''};
refresh();requestAnimationFrame(tick);
</script></body></html>
